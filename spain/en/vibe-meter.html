<div class="vibe-meter-card" style="--score: 9.6;">

<style>
.vibe-meter-card {
  --min-deg: -110deg;
  --sweep-range: 220deg;
  --final-angle: calc(var(--min-deg) + (var(--score) / 10 * var(--sweep-range)));
  width:100%;
  max-width:520px;
  margin:0 auto;
  display:block;
  position:relative;
}

/* MAIN NEEDLE POSITION */
#main-needle-group {
  transform-origin:123.77471px 127.88613px;
  transform:rotate(139.667462deg);
  transition:transform 1.2s cubic-bezier(0.4,0,0.2,1);
}

/* MINI-NEEDLE POSITIONS */
.sub-dial-needle,
.sub-dial-needle-big {
  transform-origin:123.89387px 153.76831px;
  transform:rotate(0deg);
  opacity:0;
}

/* MAIN NEEDLE ANIMATION */
.vibe-meter-card.in-view #main-needle-group {
  animation:mainNeedleSettle 5.5s cubic-bezier(0.4,0,0.2,1) forwards;
}

/* MINI-NEEDLE ANIMATIONS */
.vibe-meter-card.in-view .sub-dial-needle,
.vibe-meter-card.in-view .sub-dial-needle-big {
  animation:
    miniNeedleSettle var(--settle-duration, 3.5s) cubic-bezier(0.4,0,0.2,1) forwards,
    miniNeedleIdle var(--idle-duration, 4.8s) ease-in-out var(--idle-delay, 3.6s) infinite;
}

/* LOCATION NUMBER DISPLAY */
.score-window-wrapper {
  width:100%;
  height:100%;
  overflow:hidden;
  position:relative;
  background:#a1a1a1;
  color:#000;
  font-family:'Century Gothic',sans-serif;
  font-size:2.3mm;
  font-weight:normal;
}

/* INITIAL AND LIVE DISPLAY SHARED DIGIT DIMENSIONS */
.location-reel,
.location-live {
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  width:100%;
  height:100%;
  line-height:12.798634px;
  font-family:'Century Gothic',sans-serif;
  font-size:2.3mm;
}

/* INITIAL ODOMETER DISPLAY */
.location-reel { display:flex; }

.digit-window {
  position:relative;
  display:block;
  width:5px;
  height:12.798634px;
  overflow:hidden;
  flex:0 0 5px;
}

.digit-reel {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  transition:transform 0.13s linear;
  will-change:transform;
}

.digit-reel span,
.tenths-reel span {
  display:block;
  box-sizing:border-box;
  width:100%;
  height:12.798634px;
  min-height:12.798634px;
  max-height:12.798634px;
  margin:0;
  padding:0;
  flex-shrink:0;
  line-height:12.798634px;
  text-align:center;
  white-space:nowrap;
  font-family:'Century Gothic',sans-serif;
  font-size:2.3mm;
  font-weight:normal;
  font-variant-numeric:lining-nums tabular-nums;
  font-feature-settings:"lnum","tnum";
}

.location-static {
  display:block;
  height:12.798634px;
  line-height:12.798634px;
  width:5px;
  flex:0 0 5px;
  text-align:center;
}

/* LIVE DISPLAY */
.location-live { display:none; }
.score-window-wrapper.show-live .location-live { display:flex; }
.score-window-wrapper.show-live .location-reel { display:none; }

.location-live-fixed {
  display:block;
  height:12.798634px;
  line-height:12.798634px;
  width:5px;
  flex:0 0 5px;
  text-align:center;
  white-space:nowrap;
}

.tenths-window {
  position:relative;
  display:block;
  height:12.798634px;
  width:5px;
  overflow:hidden;
  flex:0 0 5px;
}

.tenths-reel {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  transform:translateY(-12.798634px);
  will-change:transform;
  transition:transform 0.55s ease-in-out;
}

/* MAIN NEEDLE ANIMATION */
@keyframes mainNeedleSettle {
  0%   {transform:rotate(139.667462deg);}
  55%  {transform:rotate(349.667462deg);}
  100% {transform:rotate(349.667462deg);}
}

/* MINI-NEEDLES: long clockwise sweep */
@keyframes miniNeedleSettle {
  0% {
    transform:rotate(var(--start-angle));
    opacity:0;
  }
  1% {
    transform:rotate(var(--start-angle));
    opacity:1;
  }
  45% {
    transform:rotate(calc(var(--final-angle) + 360deg + 10deg));
    opacity:1;
  }
  72% {
    transform:rotate(calc(var(--final-angle) + 360deg - 4deg));
    opacity:1;
  }
  100% {
    transform:rotate(calc(var(--final-angle) + 360deg));
    opacity:1;
  }
}

/* SMALL MOVEMENTS AFTER SETTLING */
@keyframes miniNeedleIdle {
  0%, 75%, 100% {
    transform:rotate(var(--final-angle));
  }
  84% {
    transform:rotate(calc(var(--final-angle) + var(--wiggle)));
  }
  92% {
    transform:rotate(calc(var(--final-angle) - var(--wiggle)));
  }
}
</style>

<!-- INLINE JAVASCRIPT -->
<script>
(function() {

  function initialiseVibeMeters() {

    const cards = document.querySelectorAll('.vibe-meter-card');

    cards.forEach(card => {

      const wrapper = card.querySelector('.score-window-wrapper');
      const unitsReel = card.querySelector('.units-reel');
      const initialTenthsReel = card.querySelector('.initial-tenths-reel');
      const liveTenthsReel = card.querySelector('.tenths-reel');
      const mainNeedle = card.querySelector('#main-needle-group');

      if (!wrapper || !unitsReel || !initialTenthsReel || !liveTenthsReel) return;
      if (card.dataset.initialised === 'true') return;

      card.dataset.initialised = 'true';

      /* MINI-NEEDLE SCORES AND MOVEMENT */
      const miniNeedles = card.querySelectorAll('.sub-dial-needle, .sub-dial-needle-big');

      const needleSettings = [
        {settle:3.2, idle:4.5, delay:3.3, wiggle:2.0},
        {settle:3.7, idle:5.1, delay:3.8, wiggle:1.6},
        {settle:3.4, idle:4.8, delay:3.5, wiggle:2.2},
        {settle:3.9, idle:5.3, delay:4.0, wiggle:1.8}
      ];

      miniNeedles.forEach((needle, index) => {
        const score = Number(needle.dataset.score);
        const bearing = Number(needle.dataset.bearing);
        const startAngle = 180 - bearing;
        const finalAngle = startAngle - (score * 4.5);

        needle.style.setProperty('--start-angle', startAngle + 'deg');
        needle.style.setProperty('--final-angle', finalAngle + 'deg');

        const settings = needleSettings[index];
        needle.style.setProperty('--settle-duration', settings.settle + 's');
        needle.style.setProperty('--idle-duration', settings.idle + 's');
        needle.style.setProperty('--idle-delay', settings.delay + 's');
        needle.style.setProperty('--wiggle', settings.wiggle + 'deg');
      });

      /* MAIN NEEDLE CONTROL */
      if (mainNeedle) {
        mainNeedle.addEventListener('animationend', function(event) {
          if (event.animationName === 'mainNeedleSettle') {
            mainNeedle.style.animation = 'none';
            mainNeedle.style.transform = 'rotate(349.667462deg)';
          }
        });
      }

      const rowHeight = 12.798634;

      /* BUILD THE UNITS REEL */
      for (let cycle = 0; cycle < 2; cycle++) {
        for (let i = 0; i <= 9; i++) {
          const digit = document.createElement('span');
          digit.textContent = i;
          unitsReel.appendChild(digit);
        }
      }

      /* BUILD THE INITIAL TENTHS REEL */
      for (let cycle = 0; cycle < 4; cycle++) {
        for (let i = 0; i <= 9; i++) {
          const digit = document.createElement('span');
          digit.textContent = i;
          initialTenthsReel.appendChild(digit);
        }
      }

      /* INITIAL POSITION: 07.0 */
      unitsReel.style.transform = 'translateY(-' + (7 * rowHeight) + 'px)';
      initialTenthsReel.style.transform = 'translateY(-' + (10 * rowHeight) + 'px)';

      /* BUILD LIVE TENTHS REEL */
      [5, 6, 7].forEach(number => {
        const digit = document.createElement('span');
        digit.textContent = number;
        liveTenthsReel.appendChild(digit);
      });

      /* START THE ODOMETER */
      function startOdometer() {
        let step = 0;
        const totalSteps = 26;
        const duration = 4000;
        const interval = duration / totalSteps;

        function advanceReels() {
          step++;
          const unitsPosition = 7 + Math.floor(step / 10);
          const tenthsPosition = 10 + step;

          unitsReel.style.transform = 'translateY(-' + (unitsPosition * rowHeight) + 'px)';
          initialTenthsReel.style.transform = 'translateY(-' + (tenthsPosition * rowHeight) + 'px)';

          if (step < totalSteps) {
            setTimeout(advanceReels, interval);
          } else {
            setTimeout(startLiveDisplay, 150);
          }
        }
        setTimeout(advanceReels, interval);
      }

      /* SWITCH TO LIVE DISPLAY */
      function startLiveDisplay() {
        wrapper.classList.add('show-live');

        const liveScores = [
          30, 34, 28, 32, 26,
          31, 35, 29, 33, 27,
          32, 28, 34, 25, 31,
          36, 29, 33, 27, 30
        ];

        const intervals = [
          4200, 5100, 3700, 6200, 4500,
          5800, 3900, 5400, 4300, 6000
        ];

        let position = 0;
        function updateLiveScore() {
          const score = liveScores[position % liveScores.length];

          if (mainNeedle) {
            const needleAngle = score + 319.667462;
            mainNeedle.style.transform = 'rotate(' + needleAngle + 'deg)';
          }

          const delay = intervals[position % intervals.length];
          position++;
          setTimeout(updateLiveScore, delay);
        }
        setTimeout(updateLiveScore, 2500);
      }

      card.startOdometer = startOdometer;
    });

    /* START WHEN THE METER ENTERS THE VIEW */
    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          if (entry.target.startOdometer) entry.target.startOdometer();
          observer.unobserve(entry.target);
        }
      });
    }, {
      root:null,
      rootMargin:"-40% 0px -40% 0px",
      threshold:0
    });

    cards.forEach(card => observer.observe(card));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialiseVibeMeters);
  } else {
    initialiseVibeMeters();
  }

})();
</script>
